<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>PetClinic :: Login</title>
	<link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
</head>
<body>
<div th:replace="~{fragments/layout :: layout (~{::body},'login')}">
	<body>
	<h2>Sign in</h2>

	<div class="alert alert-danger" th:if="${param.error}">
		Invalid username or password.
	</div>

	<div class="alert alert-success" th:if="${param.logout}">
		You have been logged out.
	</div>

	<form th:action="@{/login}" method="post" class="form-horizontal">
		<div class="form-group">
			<label for="username" class="col-sm-2 control-label">Username</label>
			<div class="col-sm-10">
				<input id="username" name="username" type="text" class="form-control" autofocus="autofocus" />
			</div>
		</div>
		<div class="form-group">
			<label for="password" class="col-sm-2 control-label">Password</label>
			<div class="col-sm-10">
				<input id="password" name="password" type="password" class="form-control" />
			</div>
		</div>
		<div class="form-group">
			<div class="col-sm-offset-2 col-sm-10">
				<button type="submit" class="btn btn-primary">Sign In</button>
			</div>
		</div>
	</form>
	</body>
</div>
</body>
</html>
