<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}">Success message</span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}">Error message</span>
  </div>

  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th th:text="#{name}">Name</th>
      <td><b th:text="*{firstName + ' ' + lastName}">Owner Name</b></td>
    </tr>
    <tr>
      <th th:text="#{address}">Address</th>
      <td th:text="*{address}">Address</td>
    </tr>
    <tr>
      <th th:text="#{city}">City</th>
      <td th:text="*{city}">City</td>
    </tr>
    <tr>
      <th th:text="#{telephone}">Telephone</th>
      <td th:text="*{telephone}">Telephone</td>
    </tr>
  </table>

  <a class="btn btn-primary"
    th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}"
    th:text="#{editOwner}">Edit Owner</a>

  <a class="btn btn-primary"
    th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}"
    th:text="#{addNewPet}">Add New Pet</a>

  <br />
  <br />
  <br />

  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <table class="table table-striped">
    <tr th:each="pet : ${owner.pets}">
      <td valign="top">
        <dl class="dl-horizontal">
          <dt th:text="#{name}">Name</dt>
          <dd th:text="${pet.name}">Pet name</dd>

          <dt th:text="#{birthDate}">Birth Date</dt>
          <dd th:text="${pet.birthDate != null ? #temporals.format(pet.birthDate, 'yyyy-MM-dd') : ''}">Birth Date</dd>

          <dt th:text="#{type}">Type</dt>
          <dd th:text="${pet.type}">Type</dd>
        </dl>
      </td>
      <td valign="top">
        <table class="table table-condensed">
          <thead>
            <tr>
              <th th:text="#{visitDate}">Visit Date</th>
              <th th:text="#{description}">Description</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(pet.visits)}">
              <td colspan="2" th:text="#{noVisits}">No visits</td>
            </tr>
            <tr th:each="visit : ${pet.visits}">
              <td th:text="${visit.date != null ? #temporals.format(visit.date, 'yyyy-MM-dd') : ''}">2020-01-01</td>
              <td th:text="${visit.description}">Description</td>
            </tr>
            <tr>
              <td>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/edit(ownerId=${owner.id},petId=${pet.id})}"
                  th:text="#{editPet}">Edit Pet</a>
              </td>
              <td>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id},petId=${pet.id})}"
                  th:text="#{addVisit}">Add Visit</a>
              </td>
              <td>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/appointments/new(ownerId=${owner.id},petId=${pet.id})}">
                  Schedule Appointment
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </table>

  <script>
    // Function to hide the success and error messages after 3 seconds
    function hideMessages() {
      setTimeout(function () {
        var successEl = document.getElementById("success-message");
        var errorEl = document.getElementById("error-message");
        if (successEl) successEl.style.display = "none";
        if (errorEl) errorEl.style.display = "none";
      }, 3000); // 3000 milliseconds (3 seconds)
    }

    // Call the function to hide messages
    hideMessages();
  </script>

</body>

</html>
