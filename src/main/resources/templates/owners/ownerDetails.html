<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}"></span>
  </div>

  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th th:text="#{name}">Name</th>
      <td><b th:text="*{firstName + ' ' + lastName}"></b></td>
    </tr>
    <tr>
      <th th:text="#{address}">Address</th>
      <td th:text="*{address}"></td>
    </tr>
    <tr>
      <th th:text="#{city}">City</th>
      <td th:text="*{city}"></td>
    </tr>
    <tr>
      <th th:text="#{telephone}">Telephone</th>
      <td th:text="*{telephone}"></td>
    </tr>
  </table>

  <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary" th:text="#{editOwner}">Edit
    Owner</a>
  <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary" th:text="#{addNewPet}">Add
    New Pet</a>

  <br />
  <br />
  <br />
  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <table class="table table-striped">

    <tr th:each="pet : ${owner.pets}">
      <td valign="top">
        <dl class="dl-horizontal">
          <dt th:text="#{name}">Name</dt>
          <dd th:text="${pet.name}"></dd>
          <dt th:text="#{birthDate}">Birth Date</dt>
          <dd th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></dd>
          <dt th:text="#{type}">Type</dt>
          <dd th:text="${pet.type}"></dd>
        </dl>
        <div class="mt-2">
          <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" th:text="#{editPet}">Edit Pet</a>
          &nbsp;|&nbsp;
          <a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" th:text="#{addVisit}">Add Visit</a>
        </div>
      </td>

      <td valign="top">
        <h4 class="mb-2" th:text="#{visits}">Visits</h4>
        <table class="table table-condensed">
          <thead>
            <tr>
              <th th:text="#{visitDate}">Visit Date</th>
              <th th:text="#{description}">Description</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="visit : ${pet.visits}">
              <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
              <td th:text="${visit?.description}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pet.visits)}">
              <td colspan="2" class="text-muted">No visits</td>
            </tr>
          </tbody>
        </table>

        <h4 class="mb-2 mt-3">Appointments</h4>
        <div class="mb-2">
          <a class="btn btn-sm btn-primary"
             th:href="@{/owners/{ownerId}/pets/{petId}/appointments/new(ownerId=${owner.id},petId=${pet.id})}">
            New Appointment
          </a>
        </div>

        <table class="table table-condensed">
          <thead>
            <tr>
              <th>Date</th>
              <th>Start Time</th>
              <th>Vet</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody th:with="appointments=${petAppointments != null and petAppointments[pet.id] != null ? petAppointments[pet.id] : T(java.util.Collections).emptyList()}">
            <tr th:each="appt : ${appointments}">
              <td th:text="${#temporals.format(appt.appointmentDate, 'yyyy-MM-dd')}"></td>
              <td th:text="${#temporals.format(appt.startTime, 'HH:mm')}"></td>
              <td th:text="${appt.vet != null ? appt.vet.firstName + ' ' + appt.vet.lastName : ''}"></td>
              <td th:text="${appt.status}"></td>
              <td>
                <span th:if="${appt.status != null and appt.status.name() == 'BOOKED'}">
                  <a th:href="@{/appointments/{appointmentId}/edit(appointmentId=${appt.id})}">
                    Reschedule
                  </a>
                  &nbsp;|&nbsp;
                  <form th:action="@{/appointments/{appointmentId}/cancel(appointmentId=${appt.id})}"
                        method="post"
                        class="d-inline">
                    <input type="hidden"
                           th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-link p-0 align-baseline">
                      Cancel
                    </button>
                  </form>
                </span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}">
              <td colspan="5" class="text-muted">No appointments</td>
            </tr>
          </tbody>
        </table>

      </td>
    </tr>

  </table>
  <script>
    // Function to hide the success and error messages after 3 seconds
    function hideMessages() {
      setTimeout(function () {
        const success = document.getElementById("success-message");
        const error = document.getElementById("error-message");
        if (success) {
          success.style.display = "none";
        }
        if (error) {
          error.style.display = "none";
        }
      }, 3000); // 3000 milliseconds (3 seconds)
    }

    // Call the function to hide messages
    hideMessages();
  </script>

</body>


</html>
