<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}"></span>
  </div>

  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th th:text="#{name}">Name</th>
      <td><b th:text="*{firstName + ' ' + lastName}">John Doe</b></td>
    </tr>
    <tr>
      <th th:text="#{address}">Address</th>
      <td th:text="*{address}">123 Street</td>
    </tr>
    <tr>
      <th th:text="#{city}">City</th>
      <td th:text="*{city}">City</td>
    </tr>
    <tr>
      <th th:text="#{telephone}">Telephone</th>
      <td th:text="*{telephone}">123456</td>
    </tr>
  </table>

  <a class="btn btn-primary" th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}" th:text="#{editOwner}">
    Edit Owner
  </a>
  <a class="btn btn-primary" th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}" th:text="#{addNewPet}">
    Add New Pet
  </a>

  <br />
  <br />
  <br />

  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <table class="table table-striped">
    <tr th:each="pet : ${owner.pets}">
      <td valign="top">
        <dl class="dl-horizontal">
          <dt th:text="#{name}">Name</dt>
          <dd th:text="${pet.name}">Lucky</dd>
          <dt th:text="#{birthDate}">Birth Date</dt>
          <dd th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}">2010-09-07</dd>
          <dt th:text="#{type}">Type</dt>
          <dd th:text="${pet.type}">dog</dd>
        </dl>
      </td>
      <td valign="top">
        <table class="table table-condensed">
          <thead>
            <tr>
              <th th:text="#{visitDate}">Visit Date</th>
              <th th:text="#{description}">Description</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="visit : ${pet.visits}">
              <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}">2013-01-01</td>
              <td th:text="${visit.description}">rabies shot</td>
              <td></td>
            </tr>
            <tr>
              <td>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/edit(ownerId=${owner.id},petId=${pet.id})}"
                  th:text="#{editPet}">Edit Pet</a>
              </td>
              <td>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id},petId=${pet.id})}"
                  th:text="#{addVisit}">Add Visit</a>
              </td>
              <td>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/appointments/new(ownerId=${owner.id},petId=${pet.id})}">
                  Schedule Appointment
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </table>

  <script>
    (function () {
      function hideMessages() {
        setTimeout(function () {
          var successMessage = document.getElementById("success-message");
          var errorMessage = document.getElementById("error-message");

          if (successMessage) {
            successMessage.style.display = "none";
          }
          if (errorMessage) {
            errorMessage.style.display = "none";
          }
        }, 3000);
      }

      hideMessages();
    })();
  </script>

</body>

</html>
