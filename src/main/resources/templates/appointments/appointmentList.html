<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{appointments}">Appointments</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="#{${message}}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="#{${error}}"></span>
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{type}">Type</th>
        <th th:text="#{owner}">Owner</th>
      </tr>
    </thead>
    <tr>
      <td th:text="${pet.name}"></td>
      <td th:text="${pet.type}"></td>
      <td><a th:href="@{/owners/{ownerId}(ownerId=${owner.id})}" th:text="${owner.firstName + ' ' + owner.lastName}"></a></td>
    </tr>
  </table>

  <a th:href="@{/owners/{ownerId}/pets/{petId}/appointments/new(ownerId=${owner.id},petId=${pet.id})}"
    class="btn btn-primary" id="schedule-appointment" th:text="#{scheduleAppointment}">Schedule Appointment</a>

  <h3 th:text="#{upcomingAppointments}">Upcoming Appointments</h3>
  <table class="table table-striped" id="upcoming-appointments">
    <thead>
      <tr>
        <th th:text="#{date}">Date</th>
        <th th:text="#{time}">Time</th>
        <th th:text="#{vet}">Veterinarian</th>
        <th th:text="#{reason}">Reason</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(upcoming)}">
        <td colspan="5" th:text="#{noAppointments}">No appointments</td>
      </tr>
      <tr th:each="visit : ${upcoming}">
        <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
        <td th:text="${visit.time != null ? #temporals.format(visit.time, 'HH:mm') : ''}"></td>
        <td th:text="${visit.vet != null ? visit.vet.firstName + ' ' + visit.vet.lastName : ''}"></td>
        <td th:text="${visit.description}"></td>
        <td>
          <a class="btn btn-default"
            th:href="@{/owners/{ownerId}/pets/{petId}/appointments/{visitId}/reschedule(ownerId=${owner.id},petId=${pet.id},visitId=${visit.id})}"
            th:text="#{reschedule}">Reschedule</a>
          <form method="post" style="display:inline" onsubmit="return confirm(this.dataset.confirm)"
            th:data-confirm="#{confirmCancel}"
            th:action="@{/owners/{ownerId}/pets/{petId}/appointments/{visitId}/cancel(ownerId=${owner.id},petId=${pet.id},visitId=${visit.id})}">
            <button type="submit" class="btn btn-danger" th:text="#{cancelAppointment}">Cancel</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <h3 th:text="#{appointmentHistory}">History</h3>
  <table class="table table-striped" id="appointment-history">
    <thead>
      <tr>
        <th th:text="#{date}">Date</th>
        <th th:text="#{time}">Time</th>
        <th th:text="#{vet}">Veterinarian</th>
        <th th:text="#{reason}">Reason</th>
        <th th:text="#{status}">Status</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(history)}">
        <td colspan="5" th:text="#{noAppointments}">No appointments</td>
      </tr>
      <tr th:each="visit : ${history}">
        <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
        <td th:text="${visit.time != null ? #temporals.format(visit.time, 'HH:mm') : ''}"></td>
        <td th:text="${visit.vet != null ? visit.vet.firstName + ' ' + visit.vet.lastName : ''}"></td>
        <td th:text="${visit.description}"></td>
        <td th:text="#{${'appointment.status.' + visit.status}}"></td>
      </tr>
    </tbody>
  </table>

</body>

</html>
