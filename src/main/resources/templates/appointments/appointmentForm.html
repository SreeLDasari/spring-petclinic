<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>

  <h2>New Appointment</h2>

  <table class="table table-sm">
    <tr>
      <th>Owner</th>
      <td th:text="${owner.firstName + ' ' + owner.lastName}">Owner Name</td>
    </tr>
    <tr>
      <th>Pet</th>
      <td th:text="${pet.name}">Pet Name</td>
    </tr>
  </table>

  <form th:object="${appointmentForm}" method="post" class="form-horizontal">

    <div class="form-group has-feedback" th:classappend="${#fields.hasErrors('vetId')} ? 'has-error'">
      <label class="col-sm-2 control-label" for="vetId">Vet</label>
      <div class="col-sm-10">
        <select id="vetId" name="vetId" class="form-control" th:field="*{vetId}">
          <option value="" th:text="'-- Select Vet --'"></option>
          <option th:each="vet : ${vets}" th:value="${vet.id}" th:text="${vet.firstName + ' ' + vet.lastName}"></option>
        </select>
        <span class="help-inline" th:errors="*{vetId}">Vet error</span>
      </div>
    </div>

    <div class="form-group has-feedback" th:classappend="${#fields.hasErrors('appointmentDate')} ? 'has-error'">
      <label class="col-sm-2 control-label" for="appointmentDate">Date</label>
      <div class="col-sm-10">
        <input id="appointmentDate" type="date" class="form-control" th:field="*{appointmentDate}" />
        <span class="help-inline" th:errors="*{appointmentDate}">Date error</span>
      </div>
    </div>

    <div class="form-group has-feedback" th:classappend="${#fields.hasErrors('startTime')} ? 'has-error'">
      <label class="col-sm-2 control-label" for="startTime">Time Slot</label>
      <div class="col-sm-10">
        <select id="startTime" name="startTime" class="form-control" th:field="*{startTime}">
          <option value="" th:text="'-- Select Slot --'"></option>
          <option th:each="slot : ${availableSlots}" th:value="${slot}" th:text="${slot}"></option>
        </select>
        <span class="help-inline" th:errors="*{startTime}">Time error</span>
      </div>
    </div>

    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
      <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit">Book Appointment</button>
        <a class="btn btn-default" th:href="@{/owners/{ownerId}(ownerId=${owner.id})}">Back</a>
      </div>
    </div>

  </form>

</body>
</html>
