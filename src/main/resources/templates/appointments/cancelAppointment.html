<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>
	<h2>Cancel Appointment</h2>

	<div class="alert alert-warning" role="alert">
		<p>Are you sure you want to cancel this appointment?</p>
	</div>

	<table class="table table-striped">
		<tr>
			<th>Owner</th>
			<td th:text="${owner.firstName + ' ' + owner.lastName}"></td>
		</tr>
		<tr>
			<th>Pet</th>
			<td th:text="${pet.name}"></td>
		</tr>
		<tr>
			<th>Vet</th>
			<td th:text="${appointment.vet.firstName + ' ' + appointment.vet.lastName}"></td>
		</tr>
		<tr>
			<th>When</th>
			<td th:text="${#temporals.format(appointment.appointmentDateTime, 'yyyy-MM-dd HH:mm')}"></td>
		</tr>
	</table>

	<form th:action="@{/appointments/{appointmentId}/cancel(appointmentId=${appointment.id})}" method="post">
		<button class="btn btn-danger" type="submit">Confirm Cancel</button>
		<a class="btn btn-default" th:href="@{/owners/{ownerId}(ownerId=${owner.id})}">Back</a>
	</form>
</body>

</html>
