<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">

<body>

	<h2 th:text="'Schedule Appointment for ' + ${pet.name}">Schedule Appointment</h2>

	<form th:object="${appointmentForm}" method="post"
		th:action="@{/owners/{ownerId}/pets/{petId}/appointments(ownerId=${owner.id},petId=${pet.id})}">
		<div class="form-group">
			<label for="vetId">Vet</label>
			<select id="vetId" class="form-control" th:field="*{vetId}" required="required">
				<option value="" th:text="'-- Select Vet --'">-- Select Vet --</option>
				<option th:each="vet : ${vets}" th:value="${vet.id}"
					th:text="${vet.firstName + ' ' + vet.lastName}"></option>
			</select>
			<div class="text-danger" th:if="${#fields.hasErrors('vetId')}" th:errors="*{vetId}">Vet error</div>
		</div>

		<div class="form-group">
			<label for="date">Date</label>
			<input id="date" class="form-control" type="date" th:field="*{date}" required="required" />
			<div class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Date error</div>
		</div>

		<div class="form-group">
			<label for="time">Time</label>
			<input id="time" class="form-control" type="time" th:field="*{time}" required="required" />
			<div class="text-danger" th:if="${#fields.hasErrors('time')}" th:errors="*{time}">Time error</div>
		</div>

		<div class="form-group">
			<label for="durationMinutes">Duration (minutes)</label>
			<input id="durationMinutes" class="form-control" type="number" min="1" th:field="*{durationMinutes}"
				required="required" />
			<div class="text-danger" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}">
				Duration error
			</div>
		</div>

		<div class="form-group">
			<label for="reason">Reason</label>
			<input id="reason" class="form-control" type="text" maxlength="255" th:field="*{reason}"
				required="required" />
			<div class="text-danger" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}">Reason error</div>
		</div>

		<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}"
			th:text="${err}">Conflict</div>

		<div class="form-group">
			<button class="btn btn-primary" type="submit">Save Appointment</button>
			<a class="btn btn-default" th:href="@{/owners/{ownerId}(ownerId=${owner.id})}">Cancel</a>
		</div>
	</form>

</body>

</html>
