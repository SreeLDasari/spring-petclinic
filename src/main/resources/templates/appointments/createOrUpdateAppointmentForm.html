<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>

<h2 th:text="|Schedule Appointment for ${pet.name}|">Schedule Appointment</h2>

<form th:object="${appointment}" method="post" th:action="@{/owners/{ownerId}/pets/{petId}/appointments/new(ownerId=${owner.id},petId=${pet.id})}" class="form-horizontal">

  <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert" aria-live="polite">
    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
  </div>

  <div class="form-group">
    <label class="col-sm-2 control-label" for="startDateTime">Start date/time</label>
    <div class="col-sm-10">
      <input id="startDateTime" class="form-control" type="datetime-local" th:field="*{startDateTime}" required="required"/>
      <span class="help-inline" th:errors="*{startDateTime}">error</span>
    </div>
  </div>

  <div class="form-group">
    <label class="col-sm-2 control-label" for="durationMinutes">Duration (min)</label>
    <div class="col-sm-10">
      <input id="durationMinutes" class="form-control" type="number" min="5" max="240" th:field="*{durationMinutes}"/>
      <span class="help-inline" th:errors="*{durationMinutes}">error</span>
    </div>
  </div>

  <div class="form-group">
    <label class="col-sm-2 control-label" for="vet">Veterinarian</label>
    <div class="col-sm-10">
      <select id="vet" class="form-control" th:field="*{vet}">
        <option th:value="">(none)</option>
        <option th:each="v : ${vets}" th:value="${v.id}" th:text="${v.firstName + ' ' + v.lastName}">Vet</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="col-sm-2 control-label" for="reason">Reason</label>
    <div class="col-sm-10">
      <input id="reason" class="form-control" type="text" th:field="*{reason}"/>
      <span class="help-inline" th:errors="*{reason}">error</span>
    </div>
  </div>

  <div class="form-group">
    <label class="col-sm-2 control-label" for="notes">Notes</label>
    <div class="col-sm-10">
      <textarea id="notes" class="form-control" th:field="*{notes}"></textarea>
      <span class="help-inline" th:errors="*{notes}">error</span>
    </div>
  </div>

  <div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
      <button class="btn btn-primary" type="submit">Save Appointment</button>
      <a class="btn btn-default" th:href="@{/owners/{ownerId}(ownerId=${owner.id})}">Cancel</a>
    </div>
  </div>

</form>

</body>
</html>
