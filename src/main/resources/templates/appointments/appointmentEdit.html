<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>

  <h2>Reschedule Appointment</h2>

  <table class="table table-sm">
    <tr>
      <th>Owner</th>
      <td th:text="${appointment.owner.firstName + ' ' + appointment.owner.lastName}">Owner</td>
    </tr>
    <tr>
      <th>Pet</th>
      <td th:text="${appointment.pet.name}">Pet</td>
    </tr>
    <tr>
      <th>Vet</th>
      <td th:text="${appointment.vet.firstName + ' ' + appointment.vet.lastName}">Vet</td>
    </tr>
    <tr>
      <th>Current</th>
      <td>
        <span th:text="${appointment.appointmentDate}">2026-01-01</span>
        <span th:text="${appointment.startTime}">09:00</span>
      </td>
    </tr>
  </table>

  <form th:object="${appointmentRescheduleForm}" method="post" class="form-horizontal">

    <div class="form-group has-feedback" th:classappend="${#fields.hasErrors('appointmentDate')} ? 'has-error'">
      <label class="col-sm-2 control-label" for="appointmentDate">New Date</label>
      <div class="col-sm-10">
        <input id="appointmentDate" type="date" class="form-control" th:field="*{appointmentDate}" />
        <span class="help-inline" th:errors="*{appointmentDate}">Date error</span>
      </div>
    </div>

    <div class="form-group has-feedback" th:classappend="${#fields.hasErrors('startTime')} ? 'has-error'">
      <label class="col-sm-2 control-label" for="startTime">New Time Slot</label>
      <div class="col-sm-10">
        <select id="startTime" name="startTime" class="form-control" th:field="*{startTime}">
          <option value="" th:text="'-- Select Slot --'"></option>
          <option th:each="slot : ${availableSlots}" th:value="${slot}" th:text="${slot}"></option>
        </select>
        <span class="help-inline" th:errors="*{startTime}">Time error</span>
      </div>
    </div>

    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
      <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit">Save Changes</button>
        <a class="btn btn-default" th:href="@{/owners/{ownerId}(ownerId=${appointment.owner.id})}">Back</a>
      </div>
    </div>

  </form>

</body>
</html>
